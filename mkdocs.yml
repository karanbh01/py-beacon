site_name: Beacon
site_description: >-
  Beacon is a Python toolkit for end-to-end index, ETF, and Delta-1
  derivatives development — from defining an index methodology, through
  calculating its historical levels, to backtesting a tracking portfolio
  and analysing the result.
repo_url: https://github.com/karanbh01/py-beacon
repo_name: karanbh01/py-beacon

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            docstring_section_style: table
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: true
            members_order: source
            filters: ["!^_"]

nav:
  - Home: index.md
  - Concepts:
      - Overview: concepts/overview.md
      - Universe: concepts/universe.md
      - Methodology: concepts/methodology.md
      - Backtest: concepts/backtest.md
      - Optimiser: concepts/optimiser.md
      - Risk Model: concepts/risk-model.md
  - Decisions:
      - Design tokens: decisions/0001-design-token-source-of-truth.md
      - Caching and data freshness: decisions/0002-caching-and-data-freshness.md
      - PDF engine: decisions/0003-pdf-engine.md
  - Reference:
      - Index: reference/index.md
      - Backtest: reference/backtest.md
      - Portfolio: reference/portfolio.md
      - Fund: reference/fund.md
      - Derivatives: reference/derivatives.md
      - Data: reference/data.md
      - Asset: reference/asset.md
      - Analysis: reference/analysis.md
      - Environment: reference/environment.md
