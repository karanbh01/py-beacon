name: Release

# Three ways in, one per stage of a release (BN-222):
#
#   push a tag v*        build, check, and draft a GitHub release with the files
#   run it by hand       dry run: build this ref and publish it to TestPyPI
#   publish the draft    upload the draft's own files to PyPI
#
# PyPI never gets a fresh build. It gets the exact wheel and sdist attached to
# the release that was reviewed, so what was checked is what ships.
on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: build and draft release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      # A tag that disagrees with __version__ would publish artifacts whose
      # filenames contradict the release title. Fail before building.
      - name: Verify the tag matches __version__
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re
          import sys

          tag = os.environ["GITHUB_REF_NAME"]
          source = pathlib.Path("src/beacon/__init__.py").read_text(encoding="utf-8")
          match = re.search(r'^__version__ = "([^"]+)"', source, re.MULTILINE)
          if match is None:
              sys.exit("could not find __version__ in src/beacon/__init__.py")

          version = match.group(1)
          if tag != f"v{version}":
              sys.exit(f"tag {tag} does not match __version__ {version} (expected v{version})")

          print(f"tag {tag} matches __version__ {version}")
          PY

      - name: Build wheel and sdist
        run: uv build

      - name: Check metadata
        run: uvx twine check dist/*

      - name: Verify the wheel installs and imports
        run: |
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke/bin/python dist/*.whl
          /tmp/smoke/bin/python -c "import beacon; print(beacon.__version__)"
          # The engine serves its changelog from inside the wheel (GET
          # /changelog). A wheel without it would answer 500 there.
          /tmp/smoke/bin/python -c "from beacon.changelog import entries; import beacon; assert beacon.__version__ in [e.version for e in entries()], 'no changelog section for this version in the wheel'"

      # Pulls this version's section out of CHANGELOG.md (Keep a Changelog
      # format). CHANGELOG.md arrives with BN-62; until then, and for any tag
      # with no matching section, this writes nothing and the release falls
      # back to GitHub's generated notes.
      - name: Extract changelog section
        id: changelog
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re

          tag = os.environ["GITHUB_REF_NAME"]
          version = tag.removeprefix("v")
          changelog = pathlib.Path("CHANGELOG.md")
          notes = pathlib.Path("release-notes.md")

          if not changelog.exists():
              print("no CHANGELOG.md; falling back to generated notes")
              raise SystemExit(0)

          text = changelog.read_text(encoding="utf-8")
          pattern = rf"^## \[?{re.escape(version)}\]?.*?$(.*?)(?=^## |\Z)"
          match = re.search(pattern, text, re.MULTILINE | re.DOTALL)

          if match is None or not match.group(1).strip():
              print(f"no section for {version} in CHANGELOG.md; falling back to generated notes")
              raise SystemExit(0)

          notes.write_text(match.group(1).strip() + "\n", encoding="utf-8")
          print(f"extracted {len(match.group(1).strip().splitlines())} lines for {version}")
          PY

          if [ -f release-notes.md ]; then
            echo "have_notes=true" >> "$GITHUB_OUTPUT"
          else
            echo "have_notes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: ${{ github.ref_name }}
          files: |
            dist/*.whl
            dist/*.tar.gz
          body_path: ${{ steps.changelog.outputs.have_notes == 'true' && 'release-notes.md' || '' }}
          generate_release_notes: ${{ steps.changelog.outputs.have_notes != 'true' }}
          fail_on_unmatched_files: true

  # The dry run. Builds whatever ref it is run on and publishes it to
  # TestPyPI, then installs it back from there, so the upload, the package
  # page and a real `pip install` are all exercised before PyPI sees anything.
  #
  # TestPyPI refuses a version it already holds, like PyPI, so each version
  # can be dry-run once. Run it before tagging.
  #
  # Needs a trusted publisher on test.pypi.org: project py-beacon, owner
  # karanbh01, repository py-beacon, workflow release.yml, environment
  # testpypi.
  testpypi:
    name: dry run on TestPyPI
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Build and check
        run: |
          uv build
          uvx twine check dist/*

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

      # Dependencies come from real PyPI: TestPyPI holds few of them, and
      # some it does hold are unrelated uploads under the same names. The
      # index can take a minute to show a new file, hence the retries.
      - name: Install it back from TestPyPI
        run: |
          version=$(grep -oP '^__version__ = "\K[^"]+' src/beacon/__init__.py)
          python -m venv /tmp/fromtest
          for attempt in 1 2 3 4 5 6; do
            /tmp/fromtest/bin/pip install --quiet \
              --index-url https://test.pypi.org/simple/ \
              --extra-index-url https://pypi.org/simple/ \
              "py-beacon[server]==$version" && break
            echo "not on the index yet; waiting"; sleep 30
          done
          /tmp/fromtest/bin/python -c "import beacon; assert beacon.__version__ == '$version', beacon.__version__; print('installed', beacon.__version__)"
          /tmp/fromtest/bin/python -c "import beacon.server; from beacon.changelog import entries; print(len(entries()), 'changelog entries')"

  # The real upload, when the reviewed draft release is published. It uploads
  # the files attached to that release rather than building again.
  #
  # Needs a trusted publisher on pypi.org: project py-beacon, owner
  # karanbh01, repository py-beacon, workflow release.yml, environment pypi.
  publish:
    name: publish to PyPI
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download the release's files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ github.event.release.tag_name }}" \
            --repo "${{ github.repository }}" \
            --dir dist --pattern "*.whl" --pattern "*.tar.gz"
          ls -l dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
