# For previewing docs/ locally (`mkdocs serve`) and for the CI build that
# checks it. pybeacon.dev is built by the beacon-site repository, which reads
# the `nav` below and the mkdocstrings options, and brings its own theme. See
# CONTENT.md in beacon-site for what it relies on here.
site_name: py-beacon
site_description: >-
  py-beacon is a Python toolkit for index, ETF and Delta-1 derivatives
  development: define an index methodology, calculate its history, backtest
  a portfolio that tracks it, and analyse the result.
repo_url: https://github.com/karanbh01/py-beacon
repo_name: karanbh01/py-beacon

theme:
  name: material
  features:
    # As on the site: an index.md listed first in a group is its page.
    - navigation.indexes

# Links from the site root reach other sections of pybeacon.dev (the Server
# API, say), which a local build cannot see. They are reported, not fatal;
# the site build checks them.
validation:
  links:
    absolute_links: info

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            docstring_section_style: table
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: true
            members_order: source
            show_submodules: true
            filters: ["!^_"]

nav:
  - Home: index.md
  - Concepts:
      - Overview: concepts/overview.md
      - Data: concepts/data.md
      - Universe: concepts/universe.md
      - Methodology: concepts/methodology.md
      - Expressions and screens: concepts/expressions.md
      - Backtest: concepts/backtest.md
      - Funds and ETFs: concepts/funds.md
      - Derivatives: concepts/derivatives.md
      - Optimiser: concepts/optimiser.md
      - Risk model: concepts/risk-model.md
      - Attribution: concepts/attribution.md
      - Charts: concepts/charts.md
      - Reports: concepts/reports.md
  - Serving data: serving-data.md
  - Server guide: server.md
  - Gallery: gallery.md
  - Reference:
      - reference/index.md
      - Indices: reference/indices.md
      - Universes: reference/universe.md
      - Expressions: reference/expressions.md
      - Backtest: reference/backtest.md
      - Portfolio: reference/portfolio.md
      - Funds and ETFs: reference/fund.md
      - Derivatives: reference/derivatives.md
      - Optimiser: reference/optimise.md
      - Risk: reference/risk.md
      - Analysis: reference/analysis.md
      - Data: reference/data.md
      - Synthetic data: reference/synthetic.md
      - Sample dataset: reference/testing.md
      - Assets: reference/asset.md
      - Charts: reference/plot.md
      - Reports: reference/report.md
      - Server: reference/server.md
      - Environment: reference/environment.md
      - Data sources: reference/sources.md
      - Catalogue: reference/catalogue.md
      - Design tokens: reference/tokens.md
      - Changelog: reference/changelog.md
      - Exceptions: reference/exceptions.md
