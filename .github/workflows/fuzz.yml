name: Fuzz

# Nightly rather than per-commit: a property-based sweep over every endpoint
# takes minutes and finds the kind of defect that appears from unusual input
# rather than from a change, so running it on a schedule catches the same
# problems without slowing every push.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schemathesis:
    name: schemathesis against the spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Install project and schemathesis
        run: |
          uv pip install --system -e ".[dev]"
          uv pip install --system "schemathesis>=4,<5"

      # A real store, so endpoints that need data have some. The canonical
      # frozen fixture rather than the generator: five names is plenty to
      # exercise a handler, and it keeps the step to a second.
      - name: Write a store to fuzz against
        run: python scripts/fuzz_store.py .fuzzstore

      # Over a socket rather than in-process. schemathesis v4 removed the
      # `--app` loader entirely, so the in-process design the previous version
      # of this workflow described is no longer on offer -- and that version
      # never ran, because it invoked `python -m schemathesis`, which does not
      # exist on any release.
      #
      # The cost of going over a socket is that a failure arrives as a status
      # code rather than a Python traceback. The JUnit report carries the
      # request that caused it, and the server's own log is uploaded beside
      # it, which covers the same ground.
      - name: Start the server
        run: |
          python -m beacon.server \
            --host 127.0.0.1 --port 8765 \
            --token fuzz-token --data .fuzzstore > fuzz-server.log 2>&1 &

      # `--wait-for-schema` does the readiness wait, so there is no sleep to
      # tune and no race to lose on a slow runner.
      - name: Fuzz every endpoint
        run: |
          schemathesis run http://127.0.0.1:8765/openapi.json \
            --url http://127.0.0.1:8765 \
            --header "Authorization: Bearer fuzz-token" \
            --checks all \
            --exclude-checks ignored_auth \
            --max-examples 40 \
            --wait-for-schema 30 \
            --report junit \
            --report-junit-path schemathesis.xml

      - name: Upload the report and the server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schemathesis-report
          path: |
            schemathesis.xml
            fuzz-server.log
