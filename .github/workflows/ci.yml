name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Report every failing cell, not just the first — an OS- or version-
      # specific break is exactly what this matrix exists to surface.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      # setup-python (not uv's own Python) so that `uv pip install --system`
      # has a real system interpreter to target and the installed console
      # scripts land on PATH on all three runners. uv is here for install speed.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Install project
        run: uv pip install --system -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy

      - name: Test
        run: pytest -q

  charts:
    name: chart image regression
    # One platform, not the matrix. Rendered pixels depend on the font
    # rasteriser and the matplotlib build, so a baseline is only meaningful
    # inside a fixed environment — the same reason matplotlib pins freetype for
    # its own image tests. Comparing on three operating systems would mean
    # three sets of baselines and three ways to be almost right.
    #
    # The other nine cells still run these tests without --mpl, so the charts
    # are exercised everywhere and only compared here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Install project
        run: uv pip install --system -e ".[dev]"

      - name: Compare chart images
        run: pytest tests/test_plot_images.py -q --no-cov --mpl

      # The rendered figures and their diffs, so a failure can be looked at
      # rather than guessed at from an RMS number.
      - name: Upload the comparison
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: chart-image-diff
          path: /tmp/pytest-mpl-*
          if-no-files-found: ignore

  tokens:
    name: design token drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # No install step: the script is standard library only, deliberately, so
      # a drift in the design system cannot be masked by a dependency problem.
      # It fails on drift and also when beacon-ui cannot be reached — a check
      # that could not run has not run.
      - name: Check tokens against beacon-ui
        run: python scripts/check_token_drift.py

  openapi:
    name: export openapi spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Install project with the server extra
        run: uv pip install --system -e ".[server]"

      # beacon-ui generates its client from this (BU-20), so it is published on
      # every build rather than regenerated by hand and left to drift.
      - name: Export the specification
        run: python scripts/export_openapi.py openapi.json

      - name: Upload the specification
        uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: openapi.json
          if-no-files-found: error

  docs:
    name: build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Install project with docs extra
        run: uv pip install --system -e ".[docs]"

      # Generated at build time so the gallery shows what the code currently
      # draws. A gallery that can go stale is worse than none: it becomes a
      # record of what the charts used to look like.
      - name: Render the chart gallery
        run: python scripts/build_gallery.py docs/gallery

      # --strict turns mkdocstrings/griffe warnings into errors, so a docstring
      # that stops parsing or a broken internal link fails the build here.
      - name: Build documentation
        run: mkdocs build --strict

  build:
    name: build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
          python-version: "3.11"

      - name: Build wheel and sdist
        run: uv build

      - name: Check metadata
        run: uvx twine check dist/*

      # Installs the built wheel into a clean environment holding nothing but
      # the core dependencies, so a missing module or an optional import that
      # crept into the core would fail here rather than for a user.
      - name: Verify the wheel imports and ships py.typed
        run: |
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke/bin/python dist/*.whl
          /tmp/smoke/bin/python -c "import beacon; print(beacon.__version__)"
          /tmp/smoke/bin/python -c "import glob, zipfile; names = zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist(); assert 'beacon/py.typed' in names, 'py.typed missing from wheel'; print('py.typed present')"
          # The design tokens are data, not code, so nothing else would notice
          # if the build stopped shipping them until a chart failed for a user.
          /tmp/smoke/bin/python -c "import glob, zipfile; names = zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist(); assert 'beacon/tokens/colors.json' in names, 'colors.json missing from wheel'; print('colors.json present')"
          /tmp/smoke/bin/python -c "from beacon import tokens; print(f'{len(tokens.token_names())} tokens load from the installed wheel')"

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
