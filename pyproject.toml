[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "py-beacon-kit"
dynamic = ["version"]
description = "End-to-end tool kit for index, ETF & Delta-1 derivatives development"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE.txt"]
keywords = ["index", "etf", "passive", "investment", "finance", "portfolio",
            "quantitative", "quant", "data", "analysis", "backtesting", "strategy",
            "passive investing", "index investing", "systematic investing",
            "quantitative analysis", "quantitative portfolio management",
            "derivatives", "futures", "swaps", "delta-one"]
authors = [{ name = "Karan Bhanot", email = "karan.bhanot@outlook.com" }]
maintainers = [{ name = "Karan Bhanot", email = "karan.bhanot@outlook.com" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "Topic :: Office/Business :: Financial :: Investment",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3 :: Only",
]
# `exchange_calendars` is core since BN-180, not an extra. Every index carries
# a trading calendar, because one without a calendar schedules rebalances on 1
# January and 25 December — days no exchange has a session for. A required
# input cannot sit behind an extra: the core would import and then refuse to
# schedule. The alternatives (pandas' USFederalHolidayCalendar,
# pandas_market_calendars, holidays, workalendar) were measured and rejected;
# beacon/index/schedule.py records why. Cost: 1.3 MB, plus pyluach, toolz and
# korean_lunar_calendar, all small and pure-Python.
# Charts, interactive charts, PDF and Excel reports, the optimiser and
# Postgres stores are core since BN-310: a plain install does everything but
# serve the API and download market data. matplotlib is pinned to a minor
# series because chart image regression compares rendered pixels, and
# matplotlib changes its layout and rasterisation between minor releases; an
# unpinned range would make the baselines expire silently on the next release.
# fonttools measures chart text for the layout without matplotlib, and
# platformdirs gives data stores and the index cache their default folders.
# pyarrow reads and writes them as Parquet (BN-354).
dependencies = [
  "pandas",
  "numpy",
  "pydantic>=2",
  "exchange_calendars",
  "matplotlib>=3.10,<3.11",
  "fonttools",
  "plotly",
  "reportlab",
  "openpyxl",
  "scipy",
  "psycopg[binary]",
  "platformdirs",
  "pyarrow",
]

# The core imports without these. Modules that need one import it through
# beacon._optional.require(), which names the extra when it is absent.
[project.optional-dependencies]
data = ["yfinance"]
server = ["fastapi", "uvicorn[standard]", "orjson", "websockets"]
# Folded into the core in BN-310 and kept, empty, so an install command
# written for an earlier release still works.
excel = []
postgres = []
pdf = []
optimise = []
plot = []
plot-interactive = []
docs = ["mkdocs-material", "mkdocstrings[python]"]
dev = [
  "py-beacon-kit[server]",   # the server tests exercise the real app
  "pytest-mpl",          # image regression over every chart
  "pytest",
  "pytest-asyncio",      # the job registry is driven on an event loop
  "pytest-cov",
  "pytest-timeout",      # a hung job or socket read must fail, not stall CI
  "pytest-xdist",        # CI runs the suite across the runner's cores
  "ruff",
  "mypy",
  "pre-commit",
  "hypothesis",
  "httpx",               # required by fastapi's TestClient
  "nbformat",            # the examples are notebooks (BN-129)
  "nbclient",            # and are executed through a real kernel
  "ipykernel",           # which nbclient needs to start
]

[project.urls]
Homepage = "https://pybeacon.dev"
Documentation = "https://pybeacon.dev/library/"
Source = "https://github.com/karanbh01/py-beacon"
"Issue Tracker" = "https://github.com/karanbh01/py-beacon/issues"
Changelog = "https://pybeacon.dev/changelog/"

[tool.pytest.ini_options]
# The image regression tests start from matplotlib's defaults, as a user's
# session does, not from the "classic" style pytest-mpl otherwise applies:
# keys the beacon style leaves alone would differ from what users see.
mpl-default-style = "default"
markers = [
    "slow: multi-minute tests (the example notebooks); routine local runs deselect with -m 'not slow', CI runs everything",
]
testpaths = ["tests"]
# Explicit rather than auto: an async test without the marker is far more
# likely to be a mistake than an intention, and strict mode says so.
asyncio_mode = "strict"
addopts = [
  "--cov=beacon",
  "--cov-report=term-missing",
  "--cov-fail-under=80",
]
# The whole suite runs in well under a minute, so any test taking this long is
# stuck rather than slow. Without it, a job that never completes or a socket
# read with nothing to read blocks CI until the runner is killed.
timeout = 120
timeout_method = "thread"

[tool.coverage.run]
source = ["beacon"]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@abstractmethod",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

# Only the linter is adopted. `ruff format` is deliberately NOT used: it cannot
# produce the signature style CLAUDE.md mandates (first parameter on the def
# line, the rest aligned beneath it) and would revert the ~360 signatures
# reformatted in BN-53. Signature layout stays a reviewed convention, not a
# tool-enforced one.
[tool.ruff.lint]
select = [
  "E",      # pycodestyle errors
  "W",      # pycodestyle warnings
  "F",      # pyflakes
  "I",      # import sorting
  "UP",     # pyupgrade
  "B",      # bugbear
  "C4",     # comprehensions
  "SIM",    # simplifications
  "PIE",    # misc lints
  "PERF",   # performance
  "RUF",    # ruff-specific
  "PLC",    # pylint conventions
  "PLE",    # pylint errors
  "PLW",    # pylint warnings
]
ignore = [
  "RUF002",  # en dashes in docstring prose are deliberate typography
]

[tool.ruff.lint.per-file-ignores]
# Tests import inside functions on purpose: to assert on import-time behaviour
# (the pricing-module isolation test) and to keep optional-dependency imports
# out of collection.
"tests/**" = ["PLC0415"]
# The plotting package imports matplotlib inside functions on purpose. That
# laziness is its entire design — `import beacon` must cost nothing extra when
# no chart is drawn — so the rule that would forbid it is switched off here
# rather than silenced line by line.
"src/beacon/plot/**" = ["PLC0415"]
# The chart tests and the gallery script hold zero-argument lambdas that look
# redundant to the linter but are not: they defer drawing until the right style
# is active, and inlining them would render every chart when the mapping is
# built instead of inside the test that needs it.
"tests/test_plot.py" = ["PLC0415", "PLW0108"]
"tests/test_plot_images.py" = ["PLC0415", "PLW0108"]
"scripts/build_gallery.py" = ["PLW0108"]
# The examples import matplotlib inside a function on purpose: charting is
# an optional extra, and an example that cannot run without it would defeat
# the point of shipping runnable documentation. They also import their own
# shared helpers by plain name, since they run as scripts rather than as a
# package.
"examples/**" = ["PLC0415", "INP001", "T201"]

[tool.ruff.lint.isort]
known-first-party = ["beacon"]

[tool.mypy]
files = ["src/beacon"]
strict = true

# python_version is deliberately NOT pinned. Pinning it to 3.11 also forces
# mypy to parse third-party stubs as 3.11, and numpy's __init__.pyi uses PEP
# 695 `type` statements, so every 3.12/3.13 CI cell died on a syntax error in
# numpy rather than on anything in this codebase. Unpinned, mypy targets the
# interpreter it runs under, and the 3.11 matrix cell still checks this code
# as 3.11. Ruff's target-version = "py311" is what keeps the source itself
# free of 3.12-only syntax.

# pandas is treated as untyped rather than depending on pandas-stubs: those
# stubs model Series/DataFrame arithmetic far more tightly than pandas actually
# behaves, and adding them turns 68 real findings into 137 of which 69 are
# spurious operator errors. Values arriving from pandas are therefore Any, and
# strict mode still holds every Beacon-authored signature to account.
[[tool.mypy.overrides]]
module = ["pandas.*"]
ignore_missing_imports = true

# scipy is treated the same way, and for the same reason pandas-stubs was
# rejected: scipy-stubs types `minimize` as returning an OptimizeResult whose
# attributes are all Any anyway, so it buys nothing here while adding a stub
# package whose release cadence is tied to scipy's. The optimiser reads the
# result through named locals with explicit casts at the boundary.
[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true

# pyarrow ships no type information. The store and the index cache use it
# only to write and read Parquet files, and take pandas frames back at once.
[[tool.mypy.overrides]]
module = ["pyarrow.*"]
ignore_missing_imports = true

# reportlab ships no type information at all and has no stub package worth
# depending on. The renderer confines it to one module and reads nothing back
# out of it, so untyped here costs very little.
[[tool.mypy.overrides]]
module = ["reportlab.*"]
ignore_missing_imports = true

# exchange_calendars ships no py.typed marker. One module touches it, and reads
# back only a DatetimeIndex of sessions and a list of calendar names, both of
# which are re-typed at the boundary.
[[tool.mypy.overrides]]
module = ["exchange_calendars.*"]
ignore_missing_imports = true

# fontTools ships no py.typed marker. The chart layout reads glyph advances
# and outline bounds from it in one class (beacon.plot.metrics) and re-types
# them as floats there.
[[tool.mypy.overrides]]
module = ["fontTools.*"]
ignore_missing_imports = true

# dateutil, which pandas brings, ships no py.typed marker either, and its stubs
# would be one more package for one call: the date ticks (beacon.plot.dateticks)
# use relativedelta to count the years and months a range spans.
[[tool.mypy.overrides]]
module = ["dateutil.*"]
ignore_missing_imports = true

# plotly ships no py.typed marker. The interactive charts (BN-301) build its
# figures from plain dicts, so its types would add little.
[[tool.mypy.overrides]]
module = ["plotly.*"]
ignore_missing_imports = true

[tool.hatch.version]
path = "src/beacon/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/beacon"]

# The engine serves its own changelog at GET /changelog, and an installed
# engine has no repository beside it, so the wheel carries a copy. The root
# file stays the only one anybody edits.
[tool.hatch.build.targets.wheel.force-include]
"CHANGELOG.md" = "beacon/CHANGELOG.md"

[tool.hatch.build.targets.sdist]
# Anchored with a leading slash: the patterns are gitignore-style, so a bare
# "examples" also matched .hypothesis/examples and shipped a test cache.
include = ["/src/beacon", "/tests", "/examples", "/README.md", "/LICENSE.txt",
           "/CHANGELOG.md"]
